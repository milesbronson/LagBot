services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: lagbot
      POSTGRES_PASSWORD: lagbot
      POSTGRES_DB: lagbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lagbot"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./src:/app/src
      - ./models:/app/models
    working_dir: /app
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://lagbot:lagbot@db:5432/lagbot
      # Pin which checkpoint the "Trained AI" opponents use; without it the
      # backend auto-picks the highest-step zip it finds under models/.
      # e.g. export LAGBOT_MODEL=models/BALANCED/final_model.zip
      - LAGBOT_MODEL=${LAGBOT_MODEL:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    environment:
      - DOCKER_ENV=true
    depends_on:
      - backend

volumes:
  pgdata:
