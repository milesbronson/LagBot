# Regret-as-reward diagnostic. Same env / pool / PPO knobs as the
# heads-up chain v3 baseline, but the terminal reward is augmented with
# the counterfactual fold-regret signal:
#
#   max_regret(hand) = max_d max(0, -invested(d)/stack - actual_reward)
#   reward'           = reward - regret_lambda * max_regret
#
# The on-policy critic in PPO only sees the value of the trajectory
# actually played, so it can't tell the policy that folding would have
# been better in expectation. The CFR-style regret signal injects that
# counterfactual directly into the reward, which GAE then distributes
# back to each in-hand decision.
#
# Toggle modes via reward.mode:
#   - profit       : passthrough (identical to baseline training)
#   - regret_blend : reward - lambda * max_regret  <-- USE THIS for
#                    training. Standard hybrid (StepScorer / PRM
#                    family): keep the profit gradient, add a dense
#                    penalty for missed folds.
#   - regret_only  : -max_regret. Diagnostic only — drops profit, so
#                    the bot can't tell "won big" from "broke even"
#                    and degenerates to fold-everything. Do not use
#                    as a curriculum reward.

environment:
  num_players: 2
  starting_stack: 1000
  small_blind: 5
  big_blind: 10
  min_raise_multiplier: 2.0
  rake_enabled: false
  rake_percent: 0.0
  rake_cap: 0
  reset_stacks_every_n_timesteps: 3000
  raise_bins: [0.25, 0.5, 0.75, 1.0, 1.5, 2.0, 3.0, 5.0]

training:
  total_timesteps: 2000000
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 128
  n_epochs: 5
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.05
  vf_coef: 0.5
  max_grad_norm: 0.5

reward:
  mode: regret_blend
  regret_lambda: 1.0

opponents:
  strategy: stratified_by_anchor
  kind: null
  fixed_ids: []
  with_replacement: false

continuation:
  resume_from: heads_up_anchor_8bin_v1
  generations: 1

eval_gate:
  enabled: true
  num_hands: 1000
  threshold_mbb_per_100: -100.0
  seed: 0

stratified_eval_gate:
  enabled: true
  num_hands: 2000
  per_stratum_threshold_mbb_per_100: -100.0
  aggregate_threshold_mbb_per_100: -50.0
  min_strata_to_pass: 6
  cards_per_stratum: 1
  seed: 0
  include_anchors: true
  max_retries: 2
  retry_seed_offset: 1000

regression_eval:
  enabled: true
  num_hands: 500
  threshold_mbb_per_100: -100.0
  seed: 0
  include_fixtures: true

ppo:
  policy: "MlpPolicy"
  verbose: 1
  tensorboard_log: "./logs/"

logging:
  log_dir: "./logs/"
  save_frequency: 100000
  model_dir: "./models/"
