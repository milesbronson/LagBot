# 8-bin heads-up chain v5 — full self-play chain on the regret_blend
# reward, starting from regret_anchor_v2 (gen 77, the strongest passing
# regret_blend card: 9/10 strata, +939k aggregate vs the anchor pool).
#
# Known dynamics going in (see memory project_checkpoint_selection_bug):
#   - Each gen drifts back toward aggression because the BestCheckpoint
#     sweep ranks vs the single parent, which is anti-correlated with the
#     stratified-pool gate. That sank the v4 chain at gen 0.
#   - max_retries:2 mitigates this: each gen gets up to 3 training shots,
#     and a tamer checkpoint usually lands a pass within 3 (proven on
#     regret_anchor_v2). Cost: up to 3x 2M steps per gen.
#
# This chain compounds (each passing gen becomes the next parent). Watch
# for sustained gate failures across all 3 retries on a gen — that means
# the drift has outrun the retry budget and we need the proper fix
# (rank checkpoints by pool/punisher-subset score).
#
# Prerequisite (once): python scripts/seed_anchors.py

environment:
  num_players: 2
  starting_stack: 1000
  small_blind: 5
  big_blind: 10
  min_raise_multiplier: 2.0
  rake_enabled: false
  rake_percent: 0.0
  rake_cap: 0
  reset_stacks_every_n_timesteps: 3000
  raise_bins: [0.25, 0.5, 0.75, 1.0, 1.5, 2.0, 3.0, 5.0]

training:
  total_timesteps: 2000000
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 128
  n_epochs: 5
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.05
  vf_coef: 0.5
  max_grad_norm: 0.5

reward:
  mode: regret_blend
  regret_lambda: 1.0

opponents:
  strategy: stratified_by_anchor
  kind: null
  fixed_ids: []
  with_replacement: false

continuation:
  resume_from: regret_anchor_v2
  generations: 30

eval_gate:
  enabled: true
  num_hands: 1000
  threshold_mbb_per_100: -100.0
  seed: 0

stratified_eval_gate:
  enabled: true
  num_hands: 2000
  per_stratum_threshold_mbb_per_100: -100.0
  aggregate_threshold_mbb_per_100: -50.0
  min_strata_to_pass: 6
  cards_per_stratum: 1
  seed: 0
  include_anchors: true
  max_retries: 2
  retry_seed_offset: 1000

regression_eval:
  enabled: true
  num_hands: 500
  threshold_mbb_per_100: -100.0
  seed: 0
  include_fixtures: true

ppo:
  policy: "MlpPolicy"
  verbose: 1
  tensorboard_log: "./logs/"

logging:
  log_dir: "./logs/"
  save_frequency: 100000
  model_dir: "./models/"
